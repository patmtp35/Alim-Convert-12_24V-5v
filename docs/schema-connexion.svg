<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Alim 5 V sur rail DIN — schéma de connexion</text>

  <!-- PACK -->
  <rect x="25" y="110" width="130" height="230" rx="8" fill="#eef3f8" stroke="#34495e" stroke-width="2"/>
  <text x="90" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Pack batterie</text>
  <text x="90" y="237" text-anchor="middle" font-size="14" fill="#222">12 / 24 V</text>
  <text x="90" y="262" text-anchor="middle" font-size="11" fill="#555">fusible général</text>
  <text x="90" y="277" text-anchor="middle" font-size="11" fill="#555">au plus près du pack</text>
  <text x="145" y="153" text-anchor="end" font-size="20" font-weight="bold" fill="#c0392b">+</text>
  <text x="145" y="322" text-anchor="end" font-size="20" font-weight="bold" fill="#222">−</text>

  <!-- + line -->
  <line x1="155" y1="160" x2="215" y2="160" stroke="#c0392b" stroke-width="3"/>
  <!-- F1 -->
  <rect x="215" y="140" width="120" height="40" rx="4" fill="#fff8e1" stroke="#b9770e" stroke-width="2"/>
  <text x="275" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">F1</text>
  <text x="275" y="172" text-anchor="middle" font-size="11" fill="#222">porte-fusible 5×20</text>
  <text x="275" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1 A · T (temporisé)</text>
  <text x="275" y="221" text-anchor="middle" font-size="12" fill="#222">≥ 32 V DC · céramique · H</text>

  <line x1="335" y1="160" x2="560" y2="160" stroke="#c0392b" stroke-width="3"/>

  <!-- CONVERTISSEUR -->
  <rect x="560" y="95" width="230" height="270" rx="8" fill="#e8f1fb" stroke="#1f4e8c" stroke-width="2"/>
  <text x="675" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Convertisseur DollaTek</text>
  <text x="675" y="136" text-anchor="middle" font-size="11" fill="#222">entrée 9–36 V (annoncée) → 5 V / 5 A</text>
  <!-- entrée -->
  <text x="570" y="165" font-size="12" font-weight="bold" fill="#222">IN+</text>
  <text x="570" y="327" font-size="12" font-weight="bold" fill="#222">IN−</text>
  <!-- D1 interne -->
  <rect x="580" y="215" width="80" height="55" rx="5" fill="#fff" stroke="#1f4e8c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="620" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">D1 interne</text>
  <text x="620" y="247" text-anchor="middle" font-size="10" fill="#555">anti-inversion</text>
  <text x="620" y="261" text-anchor="middle" font-size="10" fill="#555">(selon vendeur)</text>
  <!-- bornes/connecteurs -->
  <text x="675" y="300" text-anchor="middle" font-size="11" fill="#555">entrée : bornier + jack 5,5×2,1</text>
  <text x="675" y="316" text-anchor="middle" font-size="11" fill="#555">sortie : bornier + USB-A</text>
  <!-- sortie -->
  <text x="780" y="165" text-anchor="end" font-size="12" font-weight="bold" fill="#222">OUT+</text>
  <text x="780" y="327" text-anchor="end" font-size="12" font-weight="bold" fill="#222">OUT−</text>

  <!-- - line -->
  <line x1="155" y1="320" x2="560" y2="320" stroke="#222" stroke-width="3"/>
  <line x1="790" y1="320" x2="845" y2="320" stroke="#222" stroke-width="3"/>
  <line x1="790" y1="160" x2="845" y2="160" stroke="#c0392b" stroke-width="3"/>

  <!-- CHARGES -->
  <rect x="845" y="110" width="95" height="230" rx="8" fill="#eef8ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="892" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Charges</text>
  <text x="892" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">5 V</text>
  <text x="892" y="250" text-anchor="middle" font-size="11" fill="#222">ESP32,</text>
  <text x="892" y="264" text-anchor="middle" font-size="11" fill="#222">cartes RS485</text>
  <text x="892" y="283" text-anchor="middle" font-size="10" fill="#555">≈ 0,3 A côté 24 V</text>
  <text x="852" y="140" font-size="13" font-weight="bold" fill="#c0392b">+5 V</text>
  <text x="852" y="335" font-size="13" font-weight="bold" fill="#222">GND</text>

  <!-- Notes -->
  <rect x="25" y="385" width="915" height="115" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="40" y="408" font-size="13" font-weight="bold" fill="#222">À respecter</text>
  <text x="40" y="428" font-size="12.5" fill="#222">• Le fusible va sur le + , avant tout le reste. Fil pack → boîtier : protégé à la source par son propre fusible.</text>
  <text x="40" y="446" font-size="12.5" fill="#222">• Tension max du pack (≈ 29 V en absorption, plus en égalisation) sous les 36 V annoncés par le vendeur.</text>
  <text x="40" y="464" font-size="12.5" fill="#222">• Relever IN+/IN− et OUT+/OUT− sur la sérigraphie de la carte avant de câbler.</text>
  <text x="40" y="482" font-size="12.5" fill="#222">• Ne rien relier à la borne 5 V d'une carte SoyoSource avant d'avoir mesuré (entrée ou sortie ? sélecteur Ext / DIS).</text>
</svg>
